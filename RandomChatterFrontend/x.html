<style>
  button {
    padding: 10px 20px;
    background-color: royalblue;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
  }

  button:disabled {
    background-color: #ccc;
    color: #666;
    cursor: not-allowed;
    opacity: 0.6;
  }
</style>

<button id="myButton" onclick="disableButton()">Click Me</button>

<script>
  function disableButton() {
    document.getElementById("myButton").disabled = true;
  }
</script>
